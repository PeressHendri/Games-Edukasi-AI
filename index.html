<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/Logo%20Fakultas%20Ilmu%20Komunikasi%20UKWMS.png" />
    <title>Literasi Digital AI — Game Edukasi FIKOM UKWMS</title>
    <meta name="description" content="Game edukasi interaktif Fakultas Ilmu Komunikasi (FIKOM) UKWMS untuk berpikir kritis dalam menggunakan AI. True/False + Puzzle, 5 menit, leaderboard!" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="root">
      <style>
        body { background: #1A0808; margin: 0; overflow: hidden; }
        .g-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1A0808; z-index: 99999; }
        .g-spinner { width: 42px; height: 42px; border: 4px solid rgba(220,38,38,.2); border-top-color: #DC2626; border-radius: 50%; animation: g-spin 0.9s linear infinite; margin-bottom: 16px; }

      </style>
      <div class="g-loader">
        <div class="g-spinner"></div>
        <div style="font-family: sans-serif; font-size: 14px; color: #FCA5A5; font-weight: 700; letter-spacing: 1.5px;">MEMUAT STUDIO FIKOM UKWMS...</div>
