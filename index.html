<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/rcslogo.svg" />
    <title>Literasi Digital — AI Awareness Game</title>
    <meta name="description" content="Game edukasi interaktif untuk berpikir kritis dalam menggunakan AI. Puzzle + True/False, 5 menit, leaderboard!" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/bg-truefalse.jpg" />
    <link rel="preload" as="image" href="/bg-puzzle.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <style>
        body { background: #FFFFFF; margin: 0; overflow: hidden; }
        .g-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFFFF; z-index: 99999; }
        .g-spinner { width: 40px; height: 40px; border: 4px solid rgba(79,70,229,.15); border-top-color: #4F46E5; border-radius: 50%; animation: g-spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes g-spin { to { transform: rotate(360deg); } }
      </style>
      <div class="g-loader">
        <div class="g-spinner"></div>
        <div style="font-family: sans-serif; font-size: 14px; color: #6B7280; font-weight: 600; letter-spacing: 1px;">MEMUAT GAME...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
